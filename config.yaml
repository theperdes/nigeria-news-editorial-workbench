# Public portfolio example: broad news topics, no employer watchlist.
google_news:
  locale:
    hl: en-NG
    gl: NG
    ceid: NG:en
  base_query: Nigeria
  topics:
    - name: Nigeria topic
      id: CAAqJQgKIh9DQkFTRVFvSUwyMHZNRFZqWjNZU0JXVnVMVWRDS0FBUAE
  core:
    lookback: 1d
    keywords:
    - ""
    - Tinubu
    - FEC
    - budget
    - National Assembly
    - security
    - infrastructure
    - project
    - construction
    - road
    - bridge
    - railway
    - port
    - airport
    - water
    - housing
    - industrial park
    - power
    - oil
    - gas
    - agriculture
    - mining
    - loan
    - World Bank Nigeria
    - China Nigeria
    - CBN
    - naira
    - inflation
  rotation:
    enabled: true
    daily_limit: 5
    default_lookback: 7d
    schedule:
      monday:
        - road_bridge
        - multilateral_finance
      tuesday:
        - railway_transit
        - power_detail
        - oil_gas_detail_a
      wednesday:
        - port_logistics
        - agriculture_food
      thursday:
        - airport_aviation
      friday:
        - water_housing
        - macro_economic
      saturday:
        - industrial_new_infrastructure
        - politics_governance
        - bilateral_external
      sunday:
        - project_lifecycle
        - oil_gas_detail_b
        - social_public_health
    pools:
      road_bridge:
        lookback: 7d
        keywords:
